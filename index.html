<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MES Apriso Interview Questions Bank</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">

    <!-- ── Header ─────────────────────────────────────────── -->
    <header>
      <div class="badge">Industry 4.0 &middot; MES Apriso &middot; Interview Prep</div>
      <h1>Apriso Developer<br>Question Bank</h1>
      <p class="subtitle">Experience Range: 0&ndash;4 Years &nbsp;|&nbsp; Fresher to Junior Developer</p>
      <div class="meta-row">
        <div class="meta-chip"><span class="dot dot-blue"></span> 75+ Questions</div>
        <div class="meta-chip"><span class="dot dot-green"></span> Beginner</div>
        <div class="meta-chip"><span class="dot dot-amber"></span> Intermediate</div>
        <div class="meta-chip"><span class="dot dot-red"></span> Advanced</div>
      </div>
    </header>

    <!-- ── Controls ───────────────────────────────────────── -->
    <div class="controls">
      <div class="search-wrap">
        <span class="search-icon">&#x2315;</span>
        <input type="text" id="searchInput" placeholder="Search questions...">
      </div>
      <div class="filter-btns">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="easy">Beginner</button>
        <button class="filter-btn" data-filter="medium">Intermediate</button>
        <button class="filter-btn" data-filter="hard">Advanced</button>
      </div>
    </div>

    <!-- ── Sections (rendered by app.js) ──────────────────── -->
    <div id="sections-root"></div>

    <!-- ── Footer ─────────────────────────────────────────── -->
    <footer>
      MES Apriso Interview Question Bank &nbsp;&middot;&nbsp; Infosys Prep &nbsp;&middot;&nbsp; 0&ndash;4 Yrs Experience
    </footer>

  </div>

  <!-- Load data first, then the app logic -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
